name: ShepherdiOS
options:
  bundleIdPrefix: com.street-labs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Shepherd:
    path: ../macos
  swift-composable-architecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"

settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ShepherdiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ShepherdiOSApp
    resources:
      - ShepherdiOSApp/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.street-labs.shepherd-ios
        PRODUCT_NAME: ShepherdiOS
        INFOPLIST_FILE: ShepherdiOSApp/Resources/Info.plist
        # Automatic signing for TestFlight deploy: DEVELOPMENT_TEAM is passed
        # through by scripts/deploy-ios.sh (asc local-build mode). The prior
        # CODE_SIGNING_ALLOWED/REQUIRED=NO + empty IDENTITY blocked signing
        # entirely and overrode -allowProvisioningUpdates, which is fine for
        # simulator-only `just dev-ios` but fatal for an app-store archive.
        DEVELOPMENT_TEAM: "9C9LVX9RE8"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: ShepherdiOSApp/Resources/ShepherdiOS.entitlements
    dependencies:
      - package: Shepherd
        product: AppFeature
      - package: Shepherd
        product: SharedModels
      - package: Shepherd
        product: FileBrowserFeature
      - package: Shepherd
        product: CodeViewerFeature
      - package: Shepherd
        product: CommentFeature
      - package: Shepherd
        product: InspectorFeature
      - package: Shepherd
        product: ReviewContextFeature
      - package: Shepherd
        product: IdentityFeature
      - package: Shepherd
        product: OpenPatchFeature
      - package: swift-composable-architecture
        product: ComposableArchitecture
