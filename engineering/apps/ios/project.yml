name: ShepherdiOS
options:
  bundleIdPrefix: com.streetlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Shepherd:
    path: ../macos
  swift-composable-architecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: "1.17.0"

settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ShepherdiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ShepherdiOSApp
    resources:
      - ShepherdiOSApp/Resources/Assets.xcassets
    settings:
      base:
        # Bundle ID must match the app registered in App Store Connect exactly
        # (ITMS-90055); it cannot be changed after first upload.
        PRODUCT_BUNDLE_IDENTIFIER: com.street-labs.shepherd-ios
        PRODUCT_NAME: ShepherdiOS
        INFOPLIST_FILE: ShepherdiOSApp/Resources/Info.plist
        # Automatic signing for TestFlight deploy: DEVELOPMENT_TEAM is passed
        # through by scripts/deploy-ios.sh (asc local-build mode) from the
        # per-host .env — not hardcoded here, since this is an open-source
        # repo and team IDs are per-developer. Simulator builds (`just
        # dev-ios`) don't need a team.
        CODE_SIGN_STYLE: Automatic
        # Single 1024x1024 icon; actool generates all required sizes at build
        # time and injects CFBundleIconName (ITMS-90022/90023/90713).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: ShepherdiOSApp/Resources/ShepherdiOS.entitlements
    dependencies:
      - package: Shepherd
        product: AppFeature
      - package: Shepherd
        product: SharedModels
      - package: Shepherd
        product: FileBrowserFeature
      - package: Shepherd
        product: CodeViewerFeature
      - package: Shepherd
        product: CommentFeature
      - package: Shepherd
        product: InspectorFeature
      - package: Shepherd
        product: ReviewContextFeature
      - package: Shepherd
        product: IdentityFeature
      - package: Shepherd
        product: OpenPatchFeature
      - package: swift-composable-architecture
        product: ComposableArchitecture
